<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070E1E" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#021B3A" />
    </linearGradient>
    
    <!-- Outer Shield Gradient: Cyan at top-right to Deep Royal Blue at bottom-left -->
    <linearGradient id="shieldGrad" x1="420" y1="90" x2="80" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#00A8FF" />
      <stop offset="70%" stop-color="#0066E0" />
      <stop offset="100%" stop-color="#003FA8" />
    </linearGradient>

    <!-- Inner Shield Accent Line -->
    <linearGradient id="innerShieldGrad" x1="400" y1="110" x2="100" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.3" />
    </linearGradient>

    <!-- Shopping Cart Frame & Chassis -->
    <linearGradient id="cartGrad" x1="20" y1="180" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077F2" />
      <stop offset="50%" stop-color="#0055D4" />
      <stop offset="100%" stop-color="#00359E" />
    </linearGradient>

    <!-- 3D S Ribbon Body -->
    <linearGradient id="sRibbonGrad" x1="140" y1="140" x2="280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#00A6FF" />
      <stop offset="75%" stop-color="#0058D6" />
      <stop offset="100%" stop-color="#003299" />
    </linearGradient>

    <!-- Orange Arrow Gradient -->
    <linearGradient id="orangeArrowGrad" x1="220" y1="200" x2="315" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4900" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>

    <!-- Orange Diamond Accent Gradient -->
    <linearGradient id="orangeDiamondGrad" x1="145" y1="270" x2="190" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4900" />
      <stop offset="100%" stop-color="#FF8500" />
    </linearGradient>

    <!-- Z Stem Gradient -->
    <linearGradient id="zStemGrad" x1="280" y1="140" x2="390" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#00A0FF" />
      <stop offset="100%" stop-color="#0058D6" />
    </linearGradient>

    <!-- Blue Arrow Inside Z -->
    <linearGradient id="zBlueArrowGrad" x1="330" y1="270" x2="395" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0050CC" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Solid Orange Base Bar of Z -->
    <linearGradient id="zOrangeBaseGrad" x1="260" y1="315" x2="390" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4900" />
      <stop offset="60%" stop-color="#FF7500" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <!-- Right Orange Wheel -->
    <linearGradient id="orangeWheelGrad" x1="310" y1="400" x2="365" y2="455" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E63E00" />
    </linearGradient>

    <!-- Left Blue Wheel -->
    <linearGradient id="blueWheelGrad" x1="170" y1="405" x2="225" y2="455" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007CF0" />
      <stop offset="100%" stop-color="#003D9E" />
    </linearGradient>
  
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle glow behind logo -->
  <circle cx="890" cy="315" r="220" fill="#00D2FF" opacity="0.08" />

  <!-- Logo Emblem on Right -->
  <g transform="translate(670, 75) scale(0.95)">
    

  <!-- 1. OUTER SHIELD FRAME -->
  <path
    d="M 250 34
       L 436 96
       C 446 100 452 110 452 122
       C 452 232 414 346 256 454
       C 252 457 248 457 244 454
       C 86 346 48 232 48 122
       C 48 110 54 100 64 96
       Z"
    stroke="url(#shieldGrad)"
    stroke-width="22"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Inner Shield Highlight Line -->
  <path
    d="M 250 60
       L 418 114
       C 422 208 386 306 250 410
       C 114 306 78 208 82 114
       Z"
    stroke="url(#innerShieldGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 2. SHOPPING CART HANDLE & CHASSIS -->
  <!-- Handle Bar on Left extending outwards and sweeping down -->
  <path
    d="M 12 188
       H 70
       C 88 188 100 200 108 218
       L 150 326
       C 156 340 170 350 186 350
       H 364"
    stroke="url(#cartGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Bottom Chassis Rail with rounded loop -->
  <path
    d="M 138 348
       C 134 378 152 396 182 396
       H 378"
    stroke="url(#cartGrad)"
    stroke-width="20"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 3. WHEELS & CHEVRON -->
  <!-- Left Blue Wheel Ring -->
  <circle cx="196" cy="432" r="26" fill="url(#blueWheelGrad)" />
  <circle cx="196" cy="432" r="13" fill="#FFFFFF" />

  <!-- Right Orange Wheel Ring -->
  <circle cx="338" cy="426" r="28" fill="url(#orangeWheelGrad)" />
  <circle cx="338" cy="426" r="14" fill="#FFFFFF" />

  <!-- Bottom Shield Chevron Anchor Tip -->
  <path
    d="M 224 456 L 250 482 L 276 456"
    stroke="#003FA8"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- 4. S MONOGRAM + ORANGE ACCENT + ORANGE ARROW -->
  <!-- Orange Diamond in crook of S -->
  <polygon
    points="148,244 192,230 170,264 128,278"
    fill="url(#orangeDiamondGrad)"
  />

  <!-- 3D Ribbon S Body -->
  <path
    d="M 250 144
       C 200 112 138 138 132 192
       C 126 244 196 248 244 268
       C 288 288 288 332 246 350
       C 198 366 144 338 138 298"
    stroke="url(#sRibbonGrad)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Orange Arrow on S -->
  <path
    d="M 216 204 L 292 122"
    stroke="url(#orangeArrowGrad)"
    stroke-width="22"
    stroke-linecap="round"
  />
  <polygon
    points="270,90 326,100 316,156 296,138"
    fill="url(#orangeArrowGrad)"
  />

  <!-- 5. Z MONOGRAM + BLUE ARROW + ORANGE BASE -->
  <!-- Z Top Bar and Diagonal Stem -->
  <path
    d="M 284 140 H 390 L 276 300"
    stroke="url(#zStemGrad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Blue Arrow Inside Z -->
  <path
    d="M 334 264 L 372 216"
    stroke="url(#zBlueArrowGrad)"
    stroke-width="18"
    stroke-linecap="round"
  />
  <polygon
    points="356,192 402,204 390,248 376,228"
    fill="url(#zBlueArrowGrad)"
  />

  <!-- Z Orange Base Quadrilateral -->
  <polygon
    points="258,336 388,336 376,302 292,302"
    fill="url(#zOrangeBaseGrad)"
  />

  </g>

  <!-- Typography on Left -->
  <text x="90" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#FFFFFF" letter-spacing="-2">
    <tspan fill="#00E5FF">Smart</tspan><tspan fill="#FF6B00">Zone</tspan>
  </text>
  <text x="92" y="305" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#38BDF8" letter-spacing="4">
    BEST TECH, BEST FUTURE
  </text>
  <text x="92" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    Pakistan's Premier IT Infrastructure &amp; Smart Automation Store
  </text>

  <!-- Tag Badges -->
  <rect x="92" y="440" width="160" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="172" y="467" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Enterprise IoT</text>

  <rect x="268" y="440" width="170" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="353" y="467" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Official Warranty</text>

  <rect x="454" y="440" width="170" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="539" y="467" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Nationwide Ship</text>
</svg>